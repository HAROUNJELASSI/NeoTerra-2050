<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · NEOTERRA 2050</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23050510'/><text x='50' y='62' fill='%23f4c87a' font-family='monospace' font-size='40' text-anchor='middle'>🔒</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Cinzel:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --space-black: #050510; --space-deep: #0a0a1a;
      --gold-pale: #f5e6c4; --gold-light: #f4c87a; --gold-bright: #ffd98a;
      --gold-deep: #b8860b;
      --starlight: rgba(245, 230, 196, 0.92);
      --gold-line: rgba(244, 200, 122, 0.25);
      --gold-line-hi: rgba(244, 200, 122, 0.6);
      --green-ok: #5ed670;
      --orange-warn: #f4a85a;
      --red-err: #f47a7a;
      --font-display: 'Orbitron', monospace;
      --font-decorative: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--space-black); color: var(--starlight);
      font-family: var(--font-body); font-size: 16px; line-height: 1.5;
      min-height: 100vh; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(244, 200, 122, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(200, 77, 47, 0.05) 0%, transparent 50%),
        var(--space-black);
    }

    /* LOGIN */
    #login-screen { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(5,5,16,0.97); padding: 24px; }
    .login-card { background: rgba(15,15,28,0.95); border: 1px solid var(--gold-line-hi); padding: 50px 44px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 0 60px rgba(244,200,122,0.15); position: relative; }
    .login-corner { position: absolute; width: 22px; height: 22px; border: 1.5px solid var(--gold-light); }
    .login-corner.tl { top:-7px; left:-7px; border-right:none; border-bottom:none; }
    .login-corner.tr { top:-7px; right:-7px; border-left:none; border-bottom:none; }
    .login-corner.bl { bottom:-7px; left:-7px; border-right:none; border-top:none; }
    .login-corner.br { bottom:-7px; right:-7px; border-left:none; border-top:none; }
    .login-title { font-family: var(--font-display); font-size: 1rem; letter-spacing: 0.4em; color: var(--gold-bright); text-transform: uppercase; }
    .login-divider { width: 60px; height: 1px; background: var(--gold-line-hi); margin: 18px auto 28px; }
    .login-icon { font-size: 3rem; margin-bottom: 22px; }
    .login-label { font-family: var(--font-display); font-size: 0.65rem; letter-spacing: 0.3em; color: var(--gold-deep); text-transform: uppercase; margin-bottom: 12px; }
    #login-input { width: 100%; padding: 14px 18px; background: rgba(5,5,16,0.7); border: 1px solid var(--gold-line); color: var(--gold-pale); font-family: var(--font-display); font-size: 1rem; letter-spacing: 0.08em; text-align: center; }
    #login-input:focus { outline: none; border-color: var(--gold-bright); box-shadow: 0 0 18px rgba(244,200,122,0.2); }
    #login-btn { width: 100%; margin-top: 18px; padding: 14px 24px; background: linear-gradient(135deg, var(--gold-bright), var(--gold-pale)); border: none; color: var(--space-deep); font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700; cursor: pointer; }
    #login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(244,200,122,0.3); }
    #login-error { margin-top: 18px; color: var(--red-err); font-style: italic; font-size: 0.9rem; min-height: 1.5em; }

    /* APP */
    #app { display: none; position: relative; z-index: 10; }
    #app.visible { display: block; }
    .topbar { position: sticky; top: 0; z-index: 50; background: rgba(5,5,16,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--gold-line); padding: 18px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .topbar-title { font-family: var(--font-display); font-size: 0.95rem; letter-spacing: 0.32em; color: var(--gold-bright); text-transform: uppercase; font-weight: 700; }
    .topbar-diamond { color: var(--gold-light); margin: 0 10px; }
    .topbar-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .stat-counter { font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.25em; color: var(--gold-light); padding: 6px 14px; border: 1px solid var(--gold-line); background: rgba(244,200,122,0.04); }
    .stat-counter strong { color: var(--gold-bright); }
    .logout-btn { font-family: var(--font-display); font-size: 0.65rem; letter-spacing: 0.25em; color: var(--gold-light); background: transparent; border: 1px solid var(--gold-line); padding: 8px 16px; cursor: pointer; text-transform: uppercase; }
    .logout-btn:hover { border-color: var(--gold-light); color: var(--gold-bright); }

    main { max-width: 980px; margin: 0 auto; padding: 40px 24px 140px; }
    .section { margin-bottom: 50px; }
    .section-title { font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.35em; color: var(--gold-bright); text-transform: uppercase; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--gold-line); display: flex; align-items: center; gap: 14px; }
    .section-title-icon { font-size: 1.2rem; }

    .page-group { margin-bottom: 30px; background: rgba(15,15,28,0.7); border: 1px solid var(--gold-line); }
    .page-group-header { padding: 16px 22px; background: rgba(244,200,122,0.05); border-bottom: 1px solid var(--gold-line); cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
    .page-group-header:hover { background: rgba(244,200,122,0.09); }
    .page-group-title { font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.25em; color: var(--gold-light); text-transform: uppercase; }
    .page-group-title .icon { margin-right: 10px; font-size: 1.1em; }
    .page-group-progress { font-family: var(--font-display); font-size: 0.65rem; letter-spacing: 0.18em; color: var(--gold-deep); }
    .page-group-progress.complete { color: var(--green-ok); }
    .page-group-progress.partial { color: var(--orange-warn); }
    .page-group-body { padding: 8px 0; }
    .page-group.collapsed .page-group-body { display: none; }
    .page-group-header .toggle { transition: transform 0.2s; }
    .page-group.collapsed .page-group-header .toggle { transform: rotate(-90deg); }

    .slot-row { display: grid; grid-template-columns: 220px 1fr 110px; gap: 16px; padding: 14px 22px; border-bottom: 1px dotted var(--gold-line); align-items: center; }
    .slot-row:last-child { border-bottom: none; }
    .slot-label { font-family: var(--font-decorative); font-size: 0.98rem; color: var(--gold-pale); }
    .slot-input { width: 100%; padding: 10px 14px; background: rgba(5,5,16,0.6); border: 1px solid var(--gold-line); color: var(--gold-pale); font-family: monospace; font-size: 0.95rem; }
    .slot-input:focus { outline: none; border-color: var(--gold-bright); }
    .slot-input.has-value { border-color: var(--green-ok); background: rgba(94,214,112,0.05); }
    .preview-btn { font-family: var(--font-display); font-size: 0.6rem; letter-spacing: 0.2em; color: var(--gold-light); background: transparent; border: 1px solid var(--gold-line); padding: 8px 10px; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
    .preview-btn:hover:not(:disabled) { border-color: var(--gold-bright); color: var(--gold-bright); }

    .action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5,5,16,0.97); backdrop-filter: blur(10px); border-top: 1px solid var(--gold-line-hi); padding: 16px 32px; display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); z-index: 30; }
    .action-btn { font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.22em; padding: 12px 22px; cursor: pointer; text-transform: uppercase; background: transparent; color: var(--gold-light); border: 1px solid var(--gold-line); }
    .action-btn:hover { border-color: var(--gold-light); color: var(--gold-bright); background: rgba(244,200,122,0.04); }
    .action-btn.primary { background: linear-gradient(135deg, var(--gold-bright), var(--gold-pale)); color: var(--space-deep); border-color: var(--gold-bright); font-weight: 700; }
    .action-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(244,200,122,0.3); color: var(--space-deep); }
    .action-btn.warn { color: var(--orange-warn); border-color: rgba(244,168,90,0.4); }
    .action-btn.warn:hover { border-color: var(--orange-warn); color: var(--orange-warn); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 24px; }
    .modal-backdrop.visible { display: flex; }
    .modal-card { background: var(--space-deep); border: 1px solid var(--gold-line-hi); padding: 18px; max-width: 720px; width: 100%; box-shadow: 0 0 60px rgba(244,200,122,0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-title { font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.3em; color: var(--gold-bright); text-transform: uppercase; }
    .modal-close { background: transparent; border: 1px solid var(--gold-line); color: var(--gold-light); padding: 6px 12px; cursor: pointer; font-family: var(--font-display); font-size: 0.85rem; }
    .modal-close:hover { color: var(--gold-bright); border-color: var(--gold-bright); }
    .modal-video { position: relative; padding-bottom: 56.25%; height: 0; background: black; }
    .modal-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; }

    .toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%) translateY(-20px); z-index: 300; background: rgba(15,15,28,0.97); border: 1px solid var(--gold-line-hi); padding: 14px 28px; font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.18em; color: var(--gold-bright); text-transform: uppercase; box-shadow: 0 8px 30px rgba(0,0,0,0.5); opacity: 0; transition: all 0.3s; pointer-events: none; }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--green-ok); color: var(--green-ok); }
    .toast.error { border-color: var(--red-err); color: var(--red-err); }

    @media (max-width: 720px) {
      .topbar { padding: 14px 16px; }
      .topbar-title { font-size: 0.75rem; letter-spacing: 0.2em; }
      main { padding: 24px 14px 160px; }
      .slot-row { grid-template-columns: 1fr; gap: 8px; padding: 16px; }
      .preview-btn { width: 100%; }
      .action-bar { padding: 12px 14px; gap: 8px; }
      .action-btn { font-size: 0.6rem; padding: 10px 14px; letter-spacing: 0.15em; }
    }
  </style>
</head>
<body>

  <div id="login-screen">
    <form class="login-card" id="login-form" autocomplete="off">
      <span class="login-corner tl"></span><span class="login-corner tr"></span>
      <span class="login-corner bl"></span><span class="login-corner br"></span>
      <div class="login-title">◇ NEOTERRA · ADMIN ◇</div>
      <div class="login-divider"></div>
      <div class="login-icon">🔒</div>
      <div class="login-label">Mot de passe</div>
      <input type="password" id="login-input" autocomplete="current-password" autofocus placeholder="••••••••••">

  </div>

  <div id="app">
    <div class="topbar">

      <div class="topbar-actions">
        <div class="stat-counter">VIDÉOS REMPLIES : <strong id="filled-count">0</strong> / 29</div>
        <button class="logout-btn" id="logout-btn">🔒 Déconnexion</button>
      </div>
    </div>

    <main>
      <div class="section">
        <div class="section-title">
          <span class="section-title-icon">📊</span><span>Google Analytics</span>
        </div>
        <div class="page-group">
          <div class="page-group-body">
            <div class="slot-row" style="grid-template-columns: 220px 1fr;">
              <div class="slot-label">ID de mesure GA4</div>
              <input type="text" id="ga-input" class="slot-input" placeholder="G-XXXXXXXXXX">
            </div>
          </div>

      </div>

      <div class="section">
        <div class="section-title">
          <span class="section-title-icon">📣</span><span>Bannière globale</span>
        </div>
        <div class="page-group">
          <div class="page-group-body">
            <div class="slot-row" style="grid-template-columns: 220px 1fr;">

                <input type="checkbox" id="banner-enabled" style="width:18px;height:18px;cursor:pointer;accent-color:var(--gold-bright);">
                <span style="font-family:monospace;font-size:0.9rem;">Activer la bannière sur toutes les pages</span>
              </label>
            </div>
            <div class="slot-row" style="grid-template-columns: 220px 1fr;">
              <div class="slot-label">Mode</div>
              <select id="banner-mode" class="slot-input">
                <option value="countdown">Compte à rebours</option>
                <option value="message">Message libre</option>
              </select>
            </div>
            <div class="slot-row" style="grid-template-columns: 220px 1fr;" id="banner-date-row">
              <div class="slot-label">Date cible</div>
              <input type="datetime-local" id="banner-date" class="slot-input" value="2026-05-29T08:00">
            </div>
            <div class="slot-row" style="grid-template-columns: 220px 1fr;">
              <div class="slot-label">Message</div>
              <input type="text" id="banner-message" class="slot-input" placeholder="Présentation officielle le 29 mai 2026">
            </div>
            <div class="slot-row" style="grid-template-columns: 220px 1fr;">
              <div class="slot-label">Style</div>
              <select id="banner-style" class="slot-input">
                <option value="info">Info (bleu)</option>
                <option value="warning">Warning (jaune)</option>
                <option value="success">Success (vert)</option>
                <option value="danger">Danger (rouge)</option>
              </select>
            </div>
            <div class="slot-row" style="grid-template-columns: 220px 1fr;">
              <div class="slot-label">Aperçu</div>
              <div>
                <button class="action-btn" id="btn-banner-preview" type="button">👁 Voir l'aperçu</button>
              </div>
            </div>
            <div id="banner-preview-box" style="margin:14px 0 0;padding:0;display:none;"></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">
          <span class="section-title-icon">🎬</span><span>Vidéos YouTube</span>
        </div>
        <div id="video-groups"></div>
      </div>
    </main>

    <div class="action-bar">
      <button class="action-btn" id="btn-save-local" title="Applique dans CE navigateur seulement (test)">💾 Tester en local</button>
      <button class="action-btn primary" id="btn-download" title="Télécharge le fichier à pousser sur GitHub">⬇ Télécharger videos-config.js</button>
      <button class="action-btn" id="btn-copy" title="Copie dans le presse-papier">📋 Copier le JSON</button>
      <button class="action-btn warn" id="btn-reset" title="Efface le brouillon local">🔄 Reset</button>
    </div>
  </div>

  <div class="modal-backdrop" id="preview-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Prévisualisation</div>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-video" id="modal-video-container"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="videos-config.js"></script>

  <script>
    /* ════════════════════ AUTH ════════════════════ */
    const PASSWORD_HASH = '7de049cee9211180b663069971cf469758e0fad28deb2686b8c1d85fbe4e9ea0';

    async function sha256(str) {
      const buf = new TextEncoder().encode(str);
      const hashBuf = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function isLoggedIn() { return sessionStorage.getItem('NEOTERRA_ADMIN_AUTH') === '1'; }
    function setLoggedIn(v) { if (v) sessionStorage.setItem('NEOTERRA_ADMIN_AUTH', '1'); else sessionStorage.removeItem('NEOTERRA_ADMIN_AUTH'); }

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const input = document.getElementById('login-input');
      const err = document.getElementById('login-error');
      err.textContent = '';
      const hash = await sha256(input.value);
      if (hash === PASSWORD_HASH) { setLoggedIn(true); showApp(); }
      else { err.textContent = 'Mot de passe incorrect'; input.value = ''; input.focus(); }
    });
    document.getElementById('logout-btn').addEventListener('click', function() {
      setLoggedIn(false); location.reload();
    });
    function showApp() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      initApp();
    }

    /* ════════════════════ STRUCTURE DES SLOTS ════════════════════ */
    const SLOTS = [
      { page: 'index.html', icon: '🏠', slots: [
        { key: 'index-intro', label: "Vidéo d'intro de la page d'accueil" },
      ]},
      { page: 'projet.html', icon: '📋', slots: [
        { key: 'projet-intro', label: "Vidéo de présentation du projet" },
      ]},
      { page: 'mars.html', icon: '🪐', slots: [
        { key: 'mars-apercu',       label: "Aperçu" },
        { key: 'mars-climat',       label: "Climat" },
        { key: 'mars-paysages',     label: "Paysages" },
        { key: 'mars-eau',          label: "Eau" },
        { key: 'mars-colonisation', label: "Colonisation" },
      ]},
      { page: 'cite.html', icon: '🏛', slots: [
        { key: 'cite-plan',         label: "Plan" },
        { key: 'cite-chiffres',     label: "Chiffres" },
        { key: 'cite-vision',       label: "Vision" },
        { key: 'cite-batiments',    label: "Bâtiments" },
        { key: 'cite-construction', label: "Construction" },
      ]},
      { page: 'maquette.html', icon: '🪨', slots: [
        { key: 'maquette-construction', label: "Time-lapse de construction" },
        { key: 'maquette-visite',       label: "Visite guidée (maquette finie)" },
      ]},
      { page: 'technologie.html', icon: '🛠', slots: [
        { key: 'technologie-logement',        label: "Habitat & Logement" },
        { key: 'technologie-education',       label: "Éducation & Recherche" },
        { key: 'technologie-energie',         label: "Énergie & Fusion" },
        { key: 'technologie-eau',             label: "Extraction & Traitement de l'Eau" },
        { key: 'technologie-air',             label: "Air & Oxygène" },
        { key: 'technologie-agriculture',     label: "L'Agriculture" },
        { key: 'technologie-communication',   label: "La Communication" },
        { key: 'technologie-transports',      label: "Les Transports" },
        { key: 'technologie-recyclage',       label: "Recyclage & Gestion des Déchets" },
        { key: 'technologie-medecine',        label: "Santé & Médecine" },
        { key: 'technologie-construction-ia', label: "Construction & Robotique (IA)" },
        { key: 'technologie-securite',        label: "Sécurité & Surveillance" },
        { key: 'technologie-sport',           label: "Sport & Divertissement" },
        { key: 'technologie-culture',         label: "Culture & Spiritualité" },
        { key: 'technologie-terraforming',    label: "Terraforming" },
        { key: 'technologie-cohabitation',    label: "Mixité, Cohabitation & Solidarité" },
      ]},
      { page: 'architecte.html', icon: '👤', slots: [
        { key: 'architecte-intro', label: "Vidéo de présentation par Haroun" },
      ]},
    ];
    const DRAFT_KEY = 'NEOTERRA_ADMIN_DRAFT';

    /* ════════════════════ HELPERS ════════════════════ */
    function extractYouTubeId(input) {
      if (!input) return '';
      input = input.trim();
      if (/^[A-Za-z0-9_-]{11}$/.test(input)) return input;
      const patterns = [
        /[?&]v=([A-Za-z0-9_-]{11})/,
        /youtu\.be\/([A-Za-z0-9_-]{11})/,
        /embed\/([A-Za-z0-9_-]{11})/,
        /shorts\/([A-Za-z0-9_-]{11})/,
      ];
      for (const re of patterns) { const m = input.match(re); if (m) return m[1]; }
      return input;
    }
    function loadDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } }
    function saveDraft() { localStorage.setItem(DRAFT_KEY, JSON.stringify(collectConfig())); }
    function collectConfig() {
      const cfg = {
        analytics: document.getElementById('ga-input').value.trim(),
        banner: {
          enabled: document.getElementById('banner-enabled').checked,
          mode: document.getElementById('banner-mode').value,
          targetDate: (document.getElementById('banner-date').value || '') + (document.getElementById('banner-date').value && document.getElementById('banner-date').value.length === 16 ? ':00' : ''),
          message: document.getElementById('banner-message').value.trim(),
          style: document.getElementById('banner-style').value
        },
        videos: {}
      };
      SLOTS.forEach(g => g.slots.forEach(s => {
        const inp = document.getElementById('slot-' + s.key);
        cfg.videos[s.key] = inp ? inp.value.trim() : '';
      }));
      return cfg;
    }

    /* ════════════════════ RENDU UI ════════════════════ */
    function renderVideoGroups() {
      const container = document.getElementById('video-groups');
      container.innerHTML = '';
      SLOTS.forEach(group => {
        const filled = group.slots.filter(s => {
          const v = (window.NEOTERRA_CONFIG.videos || {})[s.key];
          return v && v.length > 0;
        }).length;
        const total = group.slots.length;
        const cls = filled === total ? 'complete' : (filled > 0 ? 'partial' : '');
        const groupEl = document.createElement('div');
        groupEl.className = 'page-group';
        groupEl.innerHTML =
          '<div class="page-group-header">' +
            '<div class="page-group-title">' +
              '<span class="icon">' + group.icon + '</span>' + group.page +
              ' <span style="opacity:0.6;font-size:0.85em;">(' + total + ' vidéo' + (total>1?'s':'') + ')</span>' +
            '</div>' +
            '<div><span class="page-group-progress ' + cls + '" data-progress="' + group.page + '">' + filled + '/' + total + '</span>' +
            '<span class="toggle" style="margin-left:10px;">▼</span></div>' +
          '</div>' +
          '<div class="page-group-body">' +
            group.slots.map(s =>
              '<div class="slot-row">' +
                '<div class="slot-label">' + s.label + '</div>' +
                '<input type="text" class="slot-input" id="slot-' + s.key + '" data-key="' + s.key + '" placeholder="ID YouTube (ou colle l\'URL complète)">' +
                '<button class="preview-btn" data-preview="' + s.key + '">👁 Preview</button>' +
              '</div>'
            ).join('') +
          '</div>';
        container.appendChild(groupEl);
      });

      container.querySelectorAll('.page-group-header').forEach(h => {
        h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed'));
      });
      container.querySelectorAll('[data-preview]').forEach(b => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          const key = b.dataset.preview;
          const id = extractYouTubeId(document.getElementById('slot-' + key).value);
          if (!id || id.length < 8) { toast("ID vide ou invalide", 'error'); return; }
          openPreview(id, key);
        });
      });
      container.querySelectorAll('.slot-input').forEach(inp => {
        inp.addEventListener('input', () => {
          const cleaned = extractYouTubeId(inp.value);
          if (cleaned !== inp.value && /[\/?&]/.test(inp.value)) inp.value = cleaned;
          inp.classList.toggle('has-value', !!inp.value.trim());
          saveDraft();
          updateStats();
        });
      });
    }

    function updateStats() {
      let filled = 0;
      SLOTS.forEach(g => {
        let gFilled = 0;
        g.slots.forEach(s => {
          const inp = document.getElementById('slot-' + s.key);
          if (inp && inp.value.trim()) { filled++; gFilled++; }
        });
        const prog = document.querySelector('[data-progress="' + g.page + '"]');
        if (prog) {
          prog.textContent = gFilled + '/' + g.slots.length;
          prog.className = 'page-group-progress' + (gFilled === g.slots.length ? ' complete' : (gFilled > 0 ? ' partial' : ''));
        }
      });
      document.getElementById('filled-count').textContent = filled;
    }

    function populateInputs(cfg) {
      document.getElementById('ga-input').value = cfg.analytics || '';
      const b = cfg.banner || {};
      document.getElementById('banner-enabled').checked = !!b.enabled;
      document.getElementById('banner-mode').value = b.mode || 'countdown';
      // input datetime-local n'accepte pas les secondes : on tronque
      const td = (b.targetDate || '2026-05-29T08:00:00').slice(0, 16);
      document.getElementById('banner-date').value = td;
      document.getElementById('banner-message').value = b.message || '';
      document.getElementById('banner-style').value = b.style || 'info';
      updateBannerModeVisibility();
      Object.keys(cfg.videos || {}).forEach(key => {
        const inp = document.getElementById('slot-' + key);
        if (inp) { inp.value = cfg.videos[key] || ''; inp.classList.toggle('has-value', !!cfg.videos[key]); }
      });
      updateStats();
    }

    function updateBannerModeVisibility() {
      const mode = document.getElementById('banner-mode').value;
      document.getElementById('banner-date-row').style.display = (mode === 'countdown') ? '' : 'none';
    }

    /* ════════════════════ PREVIEW MODAL ════════════════════ */
    function openPreview(videoId, title) {
      document.getElementById('modal-title').textContent = 'Preview · ' + title;
      const url = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(videoId) + '?rel=0&autoplay=1';
      document.getElementById('modal-video-container').innerHTML =
        '<iframe src="' + url + '" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
      document.getElementById('preview-modal').classList.add('visible');
    }
    function closePreview() {
      document.getElementById('preview-modal').classList.remove('visible');
      document.getElementById('modal-video-container').innerHTML = '';
    }
    document.getElementById('modal-close').addEventListener('click', closePreview);
    document.getElementById('preview-modal').addEventListener('click', e => { if (e.target.id === 'preview-modal') closePreview(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('preview-modal').classList.contains('visible')) closePreview(); });

    /* ════════════════════ TOAST ════════════════════ */
    let toastTimer = null;
    function toast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast visible' + (type ? ' ' + type : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = 'toast', 2800);
    }

    /* ════════════════════ GÉNÉRATION FICHIER ════════════════════ */
    function generateConfigFile() {
      const cfg = collectConfig();
      let out = '/*\n';
      out += ' * NEOTERRA 2050 — Configuration centrale\n';
      out += ' * Généré par admin.html le ' + new Date().toLocaleString('fr-FR') + '\n';
      out += ' */\n';
      out += 'window.NEOTERRA_CONFIG = {\n\n';
      out += '  /* Google Analytics */\n';
      out += "  analytics: '" + (cfg.analytics || '') + "',\n\n";
      out += '  /* Bannière globale */\n';
      out += '  banner: {\n';
      out += '    enabled: ' + (cfg.banner.enabled ? 'true' : 'false') + ',\n';
      out += "    mode: '" + (cfg.banner.mode || 'countdown') + "',\n";
      out += "    targetDate: '" + (cfg.banner.targetDate || '') + "',\n";
      out += "    message: '" + (cfg.banner.message || '').replace(/'/g, "\\'") + "',\n";
      out += "    style: '" + (cfg.banner.style || 'info') + "'\n";
      out += '  },\n\n';
      out += '  /* Vidéos YouTube */\n';
      out += '  videos: {\n';
      SLOTS.forEach((g, gi) => {
        out += '\n    /* ── ' + g.page + ' ── */\n';
        g.slots.forEach((s, si) => {
          const id = cfg.videos[s.key] || '';
          const k = ("'" + s.key + "':").padEnd(34);
          const last = (gi === SLOTS.length-1) && (si === g.slots.length-1);
          out += '    ' + k + " '" + id + "'" + (last ? '' : ',') + '\n';
        });
      });
      out += '  }\n};\n';
      return out;
    }

    /* ════════════════════ ACTIONS ════════════════════ */
    document.getElementById('btn-save-local').addEventListener('click', function() {
      const cfg = collectConfig();
      localStorage.setItem('NEOTERRA_VIDEO_OVERRIDES', JSON.stringify(cfg.videos));
      localStorage.setItem('NEOTERRA_GA_OVERRIDE', cfg.analytics);
      localStorage.setItem('NEOTERRA_BANNER_OVERRIDE', JSON.stringify(cfg.banner));
      sessionStorage.removeItem('NEOTERRA_BANNER_DISMISSED');
      toast('✅ Brouillon appliqué localement', 'success');
    });
    document.getElementById('btn-download').addEventListener('click', function() {
      const content = generateConfigFile();
      const blob = new Blob([content], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'videos-config.js'; a.click();
      URL.revokeObjectURL(url);
      toast('⬇ videos-config.js téléchargé', 'success');
    });
    document.getElementById('btn-copy').addEventListener('click', async function() {
      try { await navigator.clipboard.writeText(generateConfigFile()); toast('📋 Copié', 'success'); }
      catch (e) { toast('❌ Impossible — télécharge plutôt', 'error'); }
    });
    document.getElementById('btn-reset').addEventListener('click', function() {
      if (!confirm('Effacer le brouillon en cours ?\nCette action ne touche pas le site live.')) return;
      localStorage.removeItem(DRAFT_KEY);
      localStorage.removeItem('NEOTERRA_VIDEO_OVERRIDES');
      localStorage.removeItem('NEOTERRA_GA_OVERRIDE');
      localStorage.removeItem('NEOTERRA_BANNER_OVERRIDE');
      populateInputs(window.NEOTERRA_CONFIG);
      toast('🔄 Brouillon effacé', 'success');
    });

    /* Listeners pour les inputs bannière → sauvent le brouillon */
    ['banner-enabled','banner-mode','banner-date','banner-message','banner-style'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const evt = (el.type === 'checkbox' || el.tagName === 'SELECT') ? 'change' : 'input';
      el.addEventListener(evt, function() {
        if (id === 'banner-mode') updateBannerModeVisibility();
        saveDraft();
      });
    });

    /* Bouton aperçu bannière */
    document.getElementById('btn-banner-preview').addEventListener('click', function() {
      const box = document.getElementById('banner-preview-box');
      const cfg = collectConfig().banner;
      if (!cfg.enabled) { toast('Active la bannière pour l\'apercevoir', 'error'); return; }

      // Construit la prévisualisation HTML (mêmes classes que sur le site)
      let html = '<div class="neoterra-banner style-' + cfg.style + '">';
      if (cfg.mode === 'countdown') {
        html += '<div class="neoterra-banner-jbox" data-prev-jbox>J-?</div>';
        html += '<div class="neoterra-banner-msg">' + (cfg.message || 'Présentation') + '</div>';
        html += '<div class="neoterra-banner-timer" data-prev-timer>--</div>';
      } else {
        html += '<div class="neoterra-banner-msg">' + (cfg.message || '') + '</div>';
      }
      html += '</div>';
      box.innerHTML = html;
      box.style.display = 'block';

      // Injection CSS (uniquement la 1ère fois)
      if (!document.getElementById('preview-banner-styles')) {
        const css =
          '.neoterra-banner{position:relative;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;' +
          'padding:10px 24px;font-family:sans-serif;font-size:13px;border-bottom:1px solid rgba(244,200,122,0.3);line-height:1.4;' +
          'background:linear-gradient(90deg,#0d1530 0%,#1a2050 50%,#0d1530 100%);color:#f5e6c4;border-radius:4px}' +
          '.neoterra-banner.style-info{border-bottom-color:rgba(100,150,255,0.4)}' +
          '.neoterra-banner.style-warning{border-bottom-color:rgba(255,180,60,0.4)}' +
          '.neoterra-banner.style-success{border-bottom-color:rgba(94,214,112,0.4)}' +
          '.neoterra-banner.style-danger{background:linear-gradient(90deg,#7a0a0a 0%,#c41e3a 50%,#7a0a0a 100%);color:#fff;border-bottom:2px solid #ff5050}' +
          '.neoterra-banner-jbox{background:rgba(244,200,122,0.15);border:1px solid #f4c87a;border-radius:6px;' +
          'padding:4px 12px;color:#f4c87a;font-family:monospace;font-size:16px;font-weight:600;min-width:56px;text-align:center}' +
          '.neoterra-banner.style-info .neoterra-banner-jbox{border-color:#88aaff;color:#88aaff;background:rgba(136,170,255,0.1)}' +
          '.neoterra-banner.style-warning .neoterra-banner-jbox{border-color:#ffb43c;color:#ffb43c;background:rgba(255,180,60,0.12)}' +
          '.neoterra-banner.style-success .neoterra-banner-jbox{border-color:#5ed670;color:#5ed670;background:rgba(94,214,112,0.12)}' +
          '.neoterra-banner.style-danger .neoterra-banner-jbox{border-color:#fff;color:#fff;background:rgba(0,0,0,0.25);font-weight:700}' +
          '.neoterra-banner.style-danger .neoterra-banner-msg{color:#fff;font-weight:500}' +
          '.neoterra-banner-timer{font-family:monospace;font-size:11px;color:rgba(245,230,196,0.7);padding-left:14px;border-left:1px solid rgba(244,200,122,0.25)}' +
          '.neoterra-banner.style-danger .neoterra-banner-timer{color:rgba(255,255,255,0.9);border-left-color:rgba(255,255,255,0.3)}';
        const s = document.createElement('style');
        s.id = 'preview-banner-styles';
        s.textContent = css;
        document.head.appendChild(s);
      }

      // Compte à rebours live dans la preview
      if (cfg.mode === 'countdown' && cfg.targetDate) {
        const target = new Date(cfg.targetDate);
        const jbox = box.querySelector('[data-prev-jbox]');
        const timer = box.querySelector('[data-prev-timer]');
        function tick() {
          const diff = target - new Date();
          if (diff <= 0) { jbox.textContent = 'J-0'; timer.textContent = "C'est aujourd'hui !"; return; }
          const j = Math.floor(diff / 86400000);
          const h = Math.floor((diff / 3600000) % 24);
          const m = Math.floor((diff / 60000) % 60);
          const sec = Math.floor((diff / 1000) % 60);
          const pad = n => String(n).padStart(2, '0');
          jbox.textContent = 'J-' + j;
          timer.textContent = pad(j) + ' j · ' + pad(h) + ' h · ' + pad(m) + ' min · ' + pad(sec) + ' s';
        }
        tick();
        if (window._bannerPreviewInterval) clearInterval(window._bannerPreviewInterval);
        window._bannerPreviewInterval = setInterval(tick, 1000);
      }
      toast('👁 Aperçu mis à jour', 'success');
    });

    /* ════════════════════ INIT ════════════════════ */
    function initApp() {
      renderVideoGroups();
      const draft = loadDraft();
      if (draft) { populateInputs(draft); toast('📝 Brouillon restauré'); }
      else { populateInputs(window.NEOTERRA_CONFIG); }
    }
    if (isLoggedIn()) showApp();
  </script>

</body>
</html>
